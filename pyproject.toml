[project]
name = "mlops-agile-demo"
version = "0.1.0"
description = "Experiment 1: Agile and Scrum demo — Iris flower classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
